<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#174b68"/>
  <meta name="description" content="Ứng dụng quản lý hồ sơ và tình trạng học nghề."/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://lh3.googleusercontent.com https://*.googleusercontent.com; frame-src https://accounts.google.com; connect-src 'self' https://accounts.google.com; base-uri 'self'; object-src 'none'; form-action 'self'"/>
  <title>Theo dõi học nghề</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="/app.js?v=1.2.24-RC"></script>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <section id="login" class="login-wrap">
    <div class="login-card">
      <div class="login-icon"><img src="/assets/logo.svg" alt="Logo Theo dõi học nghề" width="66" height="66"></div>
      <h1>Theo dõi học nghề</h1>
      <p class="muted">Quản lý quyết định, hồ sơ học nghề, quá trình tham gia và báo cáo thống kê.</p>
      <div id="google-login" class="google-login"></div>
      <p id="login-note" class="small muted">Đang chuẩn bị đăng nhập Google…</p>
      <p class="small note">Chỉ tài khoản đã được người quản trị cấp quyền mới truy cập được dữ liệu.</p>
    </div>
  </section>
  <div id="app" class="layout hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-icon"><img src="/assets/logo.svg" alt="Logo Theo dõi học nghề" width="48" height="48"></div><div><b>Theo dõi học nghề</b><small>Quản lý &amp; thống kê</small></div></div>
      <nav id="navigation" aria-label="Chức năng"></nav>
      <div class="sidebar-bottom"><span id="version-label">v1.2.24-RC</span><span>Phần mềm nội bộ</span></div>
    </aside>
    <div class="main-shell">
      <header class="topbar">
        <button id="menu-toggle" class="btn icon-button menu-button" aria-label="Mở menu">☰</button>
        <div class="topbar-brand"><b>Theo dõi học nghề</b></div>
        <div class="topbar-right"><div id="current-user" class="user-box"></div><button id="logout" class="btn btn-light">Đăng xuất</button></div>
      </header>
      <main id="main" class="content" tabindex="-1"></main>
    </div>
  </div>
  <div class="modal-layer hidden" id="modal-layer" aria-hidden="true"><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Biểu mẫu"></div></div>
</body>
</html>
